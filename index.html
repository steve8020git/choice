<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>선택하기</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#0c8f74">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root {
  --bg: #f3f6f5; --card: #ffffff; --ink: #18201e; --sub: #5d6b67; --faint: #8b9794; --line: #e1e8e5;
  --pri: #0c8f74; --pri-ink: #ffffff; --pri-soft: #e2f4ee; --pri-line: #9fd9c8;
  --bar: #93d6c1; --top: #fff3d1; --top-ink: #8a5a00; --me: #fff6dc;
  --danger: #c92a2a; --danger-soft: #fdecec; --shadow: 0 1px 2px rgba(16, 40, 34, .06), 0 2px 10px rgba(16, 40, 34, .05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111615; --card: #1a201f; --ink: #e8eeec; --sub: #a3b0ac; --faint: #75827e; --line: #2b3432;
    --pri: #2bb595; --pri-ink: #06261e; --pri-soft: #17322b; --pri-line: #2f6b5b;
    --bar: #23574a; --top: #3a2f12; --top-ink: #f0c661; --me: #2e2a19;
    --danger: #ff6b6b; --danger-soft: #3a1c1c; --shadow: none;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; word-break: keep-all; overflow-wrap: anywhere; }
#app { max-width: 600px; margin: 0 auto; padding: 12px 16px 120px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; opacity: .45; }
h1 { font-size: 24px; line-height: 1.3; margin: 0; letter-spacing: -.02em; }
h2.sec { font-size: 15px; color: var(--sub); margin: 22px 4px 8px; font-weight: 600; }
h3 { font-size: 17px; margin: 0 0 10px; letter-spacing: -.01em; }
small { font-weight: 400; color: var(--faint); font-size: .82em; }

.hero { text-align: center; padding: 36px 0 12px; }
.hero .logo { width: 64px; height: 64px; margin: 0 auto 12px; }
.hero .sub { color: var(--sub); margin: 6px 0 0; }
.ph { padding: 10px 2px 14px; }
.desc { margin-top: 10px; padding: 12px 14px; background: var(--pri-soft); border-radius: 12px; color: var(--ink); white-space: pre-wrap; font-size: 15px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 40px; }
.top-l, .top-r { display: flex; align-items: center; gap: 12px; }
.who { color: var(--sub); font-size: 14px; }
.link { background: none; border: 0; padding: 6px 2px; color: var(--pri); font-weight: 600; font-size: 14px; }
.link.danger { color: var(--danger); }

.card { display: block; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 0 0 12px; box-shadow: var(--shadow); text-align: left; }
.card.empty { text-align: center; color: var(--sub); padding: 28px 16px; }
.plist { position: relative; padding-right: 40px; }
.plist b { display: block; font-size: 17px; }
.plist span { display: block; color: var(--sub); font-size: 14px; margin-top: 2px; }
.plist .arrow { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-style: normal; font-size: 26px; color: var(--faint); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 11px 16px; font-weight: 600; font-size: 15px; }
.btn.pri { background: var(--pri); border-color: var(--pri); color: var(--pri-ink); }
.btn.sm { padding: 7px 11px; font-size: 14px; border-radius: 10px; }
.btn.danger { color: var(--danger); }
.btn.danger-f { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.wide { width: 100%; margin-top: 14px; padding: 14px; font-size: 16px; }
.btn.big { margin: 6px 0 12px; }

.inp { width: 100%; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 0 0 10px; }
.inp:focus { outline: 2px solid var(--pri-line); border-color: var(--pri); }
textarea.inp { resize: vertical; min-height: 44px; }
.inp.pw { letter-spacing: .25em; font-size: 20px; max-width: 220px; }
.lb { display: block; font-size: 14px; font-weight: 600; margin: 6px 0 6px; }
.ck { display: flex; gap: 8px; align-items: center; font-size: 15px; margin-top: 4px; }
.ck input { width: 20px; height: 20px; accent-color: var(--pri); }
.err { color: var(--danger); font-size: 14px; margin: 0; min-height: 0; }
.err:empty { display: none; }
.hint { color: var(--faint); font-size: 13px; margin: 6px 0 0; }
.note { background: var(--top); color: var(--top-ink); border-radius: 12px; padding: 10px 14px; font-size: 14px; margin-bottom: 12px; }

.names { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 14px; font-size: 15px; }
.chip.on { background: var(--pri); border-color: var(--pri); color: var(--pri-ink); font-weight: 600; }
.chip.add { border-style: dashed; color: var(--sub); }
.chip.add.on { color: var(--pri-ink); }

.tabs { display: flex; background: var(--line); border-radius: 12px; padding: 4px; margin: 4px 0 14px; }
.tabs button { flex: 1; border: 0; background: none; border-radius: 9px; padding: 9px 6px; font-weight: 600; color: var(--sub); font-size: 15px; }
.tabs button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.tabs small { color: inherit; opacity: .8; }

.qh { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 13px; }
.kind { color: var(--sub); font-weight: 600; }
.rule { color: var(--pri); font-weight: 600; background: var(--pri-soft); border-radius: 999px; padding: 2px 10px; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px 14px; font-size: 16px; }
.opt .box { flex: none; width: 22px; height: 22px; border: 2px solid var(--faint); border-radius: 50%; position: relative; }
.opt.multi .box { border-radius: 6px; }
.opt.on { border-color: var(--pri); background: var(--pri-soft); font-weight: 600; }
.opt.on .box { border-color: var(--pri); background: var(--pri); }
.opt.on .box::after { content: ""; position: absolute; left: 6px; top: 2px; width: 6px; height: 11px; border: solid var(--pri-ink); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); }
.opt .ot { flex: 1; }
.opt .cnt { color: var(--sub); font-size: 14px; font-weight: 500; white-space: nowrap; }

.savebar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); z-index: 5; }
.savebar > div { max-width: 600px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.savebar span { color: var(--sub); font-size: 14px; }
.savebar span.dirty { color: var(--top-ink); font-weight: 600; }
.savebar .btn { min-width: 132px; padding: 13px 18px; }

.sum { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.sum .big { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
.sum .big small { font-size: 15px; color: var(--sub); font-weight: 500; margin-left: 2px; }
.sum .wait { flex-basis: 100%; margin: 0; color: var(--sub); font-size: 14px; }
.sum .upd { flex-basis: 100%; color: var(--faint); font-size: 13px; }
.res { padding: 10px 0; border-top: 1px solid var(--line); }
.res:first-of-type { border-top: 0; }
.rl { display: flex; align-items: center; gap: 8px; }
.rl .ot { flex: 1; font-weight: 500; }
.rl .cnt { font-weight: 700; white-space: nowrap; }
.badge { background: var(--top); color: var(--top-ink); font-size: 12px; font-weight: 700; border-radius: 999px; padding: 1px 8px; }
.bar { height: 8px; background: var(--line); border-radius: 99px; margin: 6px 0; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--bar); border-radius: 99px; }
.res.best .bar i { background: var(--pri); }
.res .who { display: flex; flex-wrap: wrap; gap: 4px; }
.nm { font-size: 13px; background: var(--bg); border-radius: 6px; padding: 1px 7px; color: var(--sub); }
.nm.me { background: var(--me); color: var(--ink); font-weight: 600; }
.person { padding: 10px 0; border-top: 1px solid var(--line); }
.person:first-of-type { border-top: 0; }
.person.me { background: var(--me); margin: 0 -16px; padding: 10px 16px; }
.pn { display: flex; align-items: baseline; gap: 8px; }
.pn .link { margin-left: auto; padding: 0; font-size: 13px; }
.pn small.no { color: var(--danger); }
.pl { display: flex; gap: 10px; font-size: 14px; margin-top: 2px; }
.pl span { color: var(--faint); flex: none; min-width: 72px; max-width: 45%; }
.memo { font-size: 14px; color: var(--sub); margin-top: 4px; white-space: pre-wrap; }

.pc-h { display: flex; align-items: center; gap: 8px; }
.pc-h b { flex: 1; font-size: 17px; }
.st { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 9px; }
.st.open { background: var(--pri-soft); color: var(--pri); }
.st.closed { background: var(--line); color: var(--sub); }
.meta { color: var(--sub); font-size: 13px; margin: 4px 0 10px; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; }
.info { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; margin-bottom: 12px; }
.info dt { color: var(--faint); }
.info dd { margin: 0; font-weight: 600; word-break: break-all; }
.send { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
.send b { min-width: 56px; }
.send .tel { flex: 1; color: var(--sub); font-size: 14px; }
.send a.btn { text-decoration: none; min-width: 64px; }

.qe-h { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.qe-h .sp { flex: 1; }
.ib { border: 1px solid var(--line); background: var(--card); border-radius: 8px; width: 34px; height: 34px; padding: 0; font-size: 15px; flex: none; }
.ib.danger { color: var(--danger); }
.row2 { display: flex; gap: 8px; align-items: center; }
.row2 .inp { flex: 1 1 0; min-width: 0; width: auto; }
.row2.wrap { flex-wrap: wrap; }
.row2.wrap .inp { flex: 1 1 130px; }
.row2 .inp.num { flex: 0 0 72px; }
.row2 > span { margin-bottom: 10px; }
.olist { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 2px; }
.orow { display: flex; gap: 6px; align-items: center; }
.orow .inp { flex: 1; margin-bottom: 6px; }
.orow .ib { margin-bottom: 6px; }
.oadd { background: var(--bg); border-radius: 12px; padding: 10px; margin-top: 8px; }
.oadd .row2 .inp { margin-bottom: 0; }
.oadd .row2 .btn { flex: none; }
.oadd .lbl { font-size: 13px; font-weight: 600; color: var(--sub); margin: 0 0 6px; }
.oadd .more { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
.kinds { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 1px 8px; background: #efe7ff; color: #5b3fb3; vertical-align: 2px; margin-left: 6px; }
@media (prefers-color-scheme: dark) { .tag { background: #2c2446; color: #c9b6ff; } }
.opt.self { opacity: .45; cursor: not-allowed; }
.opt .me-tag { font-size: 12px; color: var(--faint); font-weight: 500; }
.voted { text-align: center; padding: 28px 18px; }
.voted .big-ic { font-size: 44px; line-height: 1; margin-bottom: 8px; }
.voted p { margin: 6px 0 0; color: var(--sub); font-size: 15px; }
.lock { background: var(--pri-soft); border: 1px solid var(--pri-line); border-radius: 12px; padding: 10px 14px; font-size: 14px; margin-bottom: 12px; }
.memos { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.memos li { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 15px; }
.tpl { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.tpl button { text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px; }
.tpl button b { display: block; font-size: 15px; }
.tpl button span { font-size: 13px; color: var(--sub); }
.tpl button:hover { border-color: var(--pri); }
.opt-set { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; }
.opt-set .hint { margin: 2px 0 8px 28px; }
.tag.sel { background: #fff0d6; color: #8a5a00; }
.tag.mine { background: var(--pri-soft); color: var(--pri); }
@media (prefers-color-scheme: dark) { .tag.sel { background: #3a2f12; color: #f0c661; } }
.phase .steps { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 12px; color: var(--faint); margin-bottom: 8px; }
.phase .steps i { font-style: normal; }
.phase .step { padding: 2px 8px; border-radius: 999px; background: var(--bg); }
.phase .step.done { color: var(--sub); }
.phase .step.on { background: var(--pri); color: var(--pri-ink); font-weight: 700; }
.phase .ph-now { font-size: 18px; }
.phase .ph-line { color: var(--sub); font-size: 14px; margin-top: 2px; }
.reasons { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.reasons li { background: var(--bg); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
.reasons li::before { content: "“"; color: var(--faint); margin-right: 2px; }
.reasons .by { color: var(--faint); }
.cand-h { display: flex; align-items: center; gap: 8px; }
.cand-h b { font-size: 17px; }
.cand-h small { color: var(--faint); }
.cand-h .sp { flex: 1; }
.acand { padding: 10px 0; border-top: 1px solid var(--line); }
.acand:first-of-type { border-top: 0; }
.rk { display: inline-grid; place-items: center; min-width: 24px; height: 24px; border-radius: 50%; background: var(--bg); font-size: 13px; font-weight: 700; margin-right: 8px; }
.res.best .rk { background: var(--top); color: var(--top-ink); }
.rank-meta { color: var(--sub); font-size: 13px; margin-bottom: 4px; }
details summary { cursor: pointer; color: var(--sub); font-size: 13px; margin-top: 6px; }
.vopt { display: grid; gap: 2px; }
.vrs { margin: 0 4px 6px 48px; }
.hsum { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--ink); font-size: 16px; list-style: none; }
.hsum::-webkit-details-marker { display: none; }
.hwin { margin-left: auto; font-size: 14px; color: var(--top-ink); font-weight: 600; }

.center { text-align: center; padding: 80px 0; color: var(--sub); }
.spin { width: 34px; height: 34px; margin: 0 auto 14px; border: 3px solid var(--line); border-top-color: var(--pri); border-radius: 50%; animation: sp 0.8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.foot { text-align: center; margin-top: 30px; }
.foot .link { color: var(--faint); font-weight: 500; }

#toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(20px); background: #222b29; color: #fff; padding: 11px 18px; border-radius: 12px; font-size: 15px; opacity: 0; pointer-events: none; transition: .25s; z-index: 20; max-width: calc(100% - 32px); text-align: center; }
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
.dim { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 30; }
.dlg { background: var(--card); border-radius: 16px; padding: 20px; width: 100%; max-width: 380px; }
.dlg p { margin: 0 0 16px; white-space: pre-wrap; }
.dlg-b { display: flex; gap: 8px; justify-content: flex-end; }
.dlg textarea { width: 100%; min-height: 120px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="modal"></div>
<script>var BOOT = /*BOOT*/{"api":"https://script.google.com/macros/s/AKfycbyJ8CjGcecyM3KdHFAKblFQyTEej9BYCFyMapHjMNrxEPim44EZEgf8z1NGEhuy6CyX/exec"}/*BOOT*/;</script>
<script>
// 화면 버전: Code.js 의 PAGE_VER 와 같아야 한다. 화면을 고쳐 올릴 때마다 둘 다 바꾼다.
var PAGE_VER = '2026-11-06b';

var KIND = { date: ['📅', '날짜'], time: ['⏰', '시간'], place: ['📍', '장소'], menu: ['🍽️', '메뉴'], person: ['🏆', '사람 뽑기'], etc: ['✅', '기타'] };
var MODE = { one: '1개만', upto: 'N개까지', exact: '정확히 N개', any: '여러 개 (제한 없음)' };
var Q_DEFAULT = {
  date: ['언제 만날까요?', 'any'], time: ['몇 시가 좋아요?', 'any'], place: ['어디서 만날까요?', 'one'],
  menu: ['무엇을 먹을까요?', 'one'], person: ['누구를 뽑을까요?', 'one'], etc: ['', 'one']
};
var WD = ['일', '월', '화', '수', '목', '금', '토'];
var ICON = '<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="4" y="4" width="56" height="56" rx="14" fill="#0c8f74"/><rect x="14" y="30" width="36" height="22" rx="4" fill="#fff" opacity=".95"/><rect x="22" y="28" width="20" height="4" rx="2" fill="#0a7560"/><rect x="23" y="10" width="18" height="22" rx="3" fill="#e2f4ee"/><path d="M27 21l4 4 7-8" fill="none" stroke="#0c8f74" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var $app = document.getElementById('app');
var S = { screen: '', init: null, view: null, pw: '', draft: null, memo: '', tab: 'mine', join: null, admin: null, adminPw: '', aview: null, atab: 'open', edit: null };

/* ───────── 도구 ───────── */

function $(sel) { return document.querySelector(sel); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function nl(s) { return esc(s).replace(/\n/g, '<br>'); }
function rid(p) { return p + Math.random().toString(36).slice(2, 10); }
function byKo(a, b) { return a.localeCompare(b, 'ko'); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function shortTime(s) { var m = String(s || '').match(/^\d{4}-(\d\d)-(\d\d) (\d\d:\d\d)/); return m ? (+m[1]) + '/' + (+m[2]) + ' ' + m[3] : ''; }
function shortDate(s) { var m = String(s || '').match(/^(\d{4})-(\d\d)-(\d\d)/); return m ? m[1] + '.' + m[2] + '.' + m[3] : ''; }

var store = {
  get: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
};
var sess = {
  get: function (k) { try { return sessionStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set: function (k, v) { try { if (v) sessionStorage.setItem(k, v); else sessionStorage.removeItem(k); } catch (e) { } }
};
// 프로젝트마다 기억한 이름·비밀번호 (이 기기에서만)
function logins() { return store.get('yaksok.logins', {}); }
function remember(pid, name, pw) { var l = logins(); l[pid] = { name: name, pw: pw }; store.set('yaksok.logins', l); }
function forget(pid) { var l = logins(); delete l[pid]; store.set('yaksok.logins', l); }

function call(fn) {
  var args = [].slice.call(arguments, 1);
  return fetch(BOOT.api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
    .then(function (r) { if (!r.ok) throw new Error('서버 응답 오류 (' + r.status + ')'); return r.json(); })
    .catch(function (e) { if (e instanceof SyntaxError || e instanceof TypeError) throw new Error('인터넷 연결을 확인하고 다시 시도해 주세요.'); throw e; })
    .then(function (j) { if (!j.ok) throw new Error(j.error || '오류가 났습니다.'); return j.result; });
}

function render(html, keepScroll) {
  var y = window.scrollY;
  $app.innerHTML = html;
  window.scrollTo(0, keepScroll ? y : 0);
}
function loading(text) { render('<div class="center"><div class="spin"></div>' + esc(text || '불러오는 중…') + '</div>'); }
function fatal(e, retry) {
  S.retry = retry;
  render('<div class="card empty"><p>' + esc(e.message) + '</p><button class="btn pri" data-act="retry">다시 시도</button></div>');
}
var toastTimer;
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('on'); }, 2600);
}
function ask(msg, okText, danger) {
  return new Promise(function (res) {
    var m = document.getElementById('modal');
    m.innerHTML = '<div class="dim"><div class="dlg"><p>' + nl(msg) + '</p><div class="dlg-b"><button class="btn" id="mNo">취소</button>' +
      '<button class="btn ' + (danger ? 'danger-f' : 'pri') + '" id="mOk">' + esc(okText || '확인') + '</button></div></div></div>';
    m.querySelector('#mNo').onclick = function () { m.innerHTML = ''; res(false); };
    m.querySelector('#mOk').onclick = function () { m.innerHTML = ''; res(true); };
  });
}
function copyText(text) {
  var done = function () { toast('복사했습니다. 카톡 등에 붙여 넣으세요.'); };
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).then(done, function () { showCopy(text); });
  showCopy(text);
}
function showCopy(text) {
  var m = document.getElementById('modal');
  m.innerHTML = '<div class="dim"><div class="dlg"><p>아래 글을 길게 눌러 복사하세요.</p><textarea class="inp" readonly>' + esc(text) + '</textarea><div class="dlg-b"><button class="btn pri" id="mOk">닫기</button></div></div></div>';
  m.querySelector('textarea').select();
  m.querySelector('#mOk').onclick = function () { m.innerHTML = ''; };
}
// 버튼을 누른 동안 다시 못 누르게
function busy(btn, fn) {
  if (btn.disabled) return;
  var label = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '잠시만요…';
  return Promise.resolve().then(fn).catch(function (e) { toast(e.message); }).then(function () {
    if (document.body.contains(btn)) { btn.disabled = false; btn.innerHTML = label; }
  });
}
function setUrl(params) {
  var q = new URLSearchParams();
  Object.keys(params).forEach(function (k) { q.set(k, params[k]); });
  var s = q.toString().replace(/=$/, '').replace(/=&/g, '&');
  history.replaceState(null, '', location.pathname + (s ? '?' + s : ''));
}
function siteUrl() { return location.origin + location.pathname; }
var FOOT = '<footer class="foot"><button class="link" data-act="goAdmin">관리자</button></footer>';

function ruleText(q) {
  if (q.mode === 'one') return '1개만';
  if (q.mode === 'upto') return q.n + '개까지';
  if (q.mode === 'exact') return '꼭 ' + q.n + '개';
  return '여러 개 가능';
}
function optText(q, id) { var o = q.options.filter(function (x) { return x.id === id; })[0]; return o ? o.text : ''; }
function fmtDate(d, t) {
  var m = String(d || '').match(/^(\d{4})-(\d\d)-(\d\d)$/);
  if (!m) return '';
  var dt = new Date(+m[1], +m[2] - 1, +m[3]);
  var s = (+m[1] !== new Date().getFullYear() ? m[1] + '년 ' : '') + (+m[2]) + '월 ' + (+m[3]) + '일 (' + WD[dt.getDay()] + ')';
  return t ? s + ' ' + t : s;
}

/* ───────── 시작 ───────── */

function boot() {
  var q = new URLSearchParams(location.search);
  if (q.has('admin')) return startAdmin();
  loading();
  call('apiInit').then(function (init) {
    // 깃허브가 옛 화면을 기억하고 있으면 한 번 새로 불러온다
    if (init.ver !== PAGE_VER && BOOT.api !== '/api' && q.get('v') !== init.ver) {
      q.set('v', init.ver); location.replace(location.pathname + '?' + q.toString()); return;
    }
    S.init = init;
    var pid = q.get('p');
    if (!pid && init.projects.length === 1) pid = init.projects[0].id;
    if (pid) return openProject(pid);
    showHome();
  }, function (e) { fatal(e, boot); });
}

function showHome() {
  S.screen = 'home';
  setUrl({});
  var ps = (S.init && S.init.projects) || [];
  render('<header class="hero"><div class="logo">' + ICON + '</div><h1>선택하기</h1><p class="sub">약속·메뉴 정하기부터 무기명 투표까지, 링크와 비밀번호만 있으면 참여해요</p></header>' +
    (ps.length ? '<h2 class="sec">진행 중</h2>' + ps.map(function (p) {
      return '<button class="card plist" data-act="openProject" data-id="' + esc(p.id) + '"><b>' + esc(p.title) + (p.type === 'select' ? '<span class="tag sel">선정하기 · ' + PHASE[selPhase(p)][1] + '</span>' : p.anon ? '<span class="tag">무기명</span>' : '') + '</b>' +
        (p.desc ? '<span>' + esc(p.desc.split('\n')[0]) + '</span>' : '') + '<i class="arrow">›</i></button>';
    }).join('') : '<div class="card empty">지금 진행 중인 것이 없습니다.</div>') +
    ((S.init && S.init.past || []).length ? '<h2 class="sec">지난 선정 결과</h2>' + S.init.past.map(function (p) {
      return '<button class="card plist" data-act="openProject" data-id="' + esc(p.id) + '"><b>' + esc(p.title) + '<span class="tag sel">결과 공개</span></b><i class="arrow">›</i></button>';
    }).join('') : '') + FOOT);
}

function openProject(pid) {
  var lg = logins()[pid];
  if (!lg) return showJoin(pid);
  loading('들어가는 중…');
  call('apiView', pid, lg.name, lg.pw).then(function (v) { enterView(v, lg.pw); }, function (e) {
    if (/비밀번호|명단|없는 프로젝트|마감/.test(e.message)) { forget(pid); return showJoin(pid); }
    fatal(e, function () { openProject(pid); });
  });
}

/* ───────── 이름 고르고 들어오기 ───────── */

function showJoin(pid) {
  loading('명단을 불러오는 중…');
  call('apiJoin', pid).then(function (j) {
    S.screen = 'join';
    S.join = { p: j, name: '', isNew: false };
    setUrl({ p: pid });
    var names = j.names.slice().sort(byKo);
    var many = S.init && S.init.projects.length > 1;
    render('<div class="top"><div class="top-l">' + (many ? '<button class="link" data-act="home">‹ 목록</button>' : '') + '</div></div>' +
      '<header class="ph"><h1>' + esc(j.title) + (j.anon ? '<span class="tag">무기명</span>' : '') + '</h1>' + (j.desc ? '<div class="desc">' + nl(j.desc) + '</div>' : '') + '</header>' +
      (j.type === 'select' ? '<div class="lock">🏆 <b>선정하기</b> · 후보를 추천하고 무기명으로 투표해요. 누가 누구를 뽑았는지는 관리자도 볼 수 없어요.</div>' : j.anon ? '<div class="lock">🔒 <b>무기명 투표</b>예요. 이름은 한 번만 투표하게 하려고 확인할 뿐, 누가 무엇을 골랐는지는 관리자도 볼 수 없어요.</div>' : '') +
      '<section class="card"><h3>1. 내 이름을 고르세요</h3><div class="names">' +
      names.map(function (n) { return '<button class="chip" data-act="pickName" data-name="' + esc(n) + '">' + esc(n) + '</button>'; }).join('') +
      (j.allowJoin ? '<button class="chip add" data-act="newName">+ 명단에 없어요</button>' : '') + '</div>' +
      '<div id="newBox" style="display:none"><input id="newName" class="inp" maxlength="20" placeholder="내 이름을 적어 주세요">' +
      '<input id="newPhone" class="inp" type="tel" inputmode="tel" maxlength="13" placeholder="휴대폰 번호 (선택) 010-0000-0000"></div>' +
      '<h3>2. 비밀번호</h3><input id="pw" class="inp pw" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="••••">' +
      '<p class="err" id="err"></p><button class="btn pri wide" data-act="enter">들어가기</button></section>' + FOOT);
  }, function (e) {
    toast(e.message);
    if (S.init) showHome(); else boot();
  });
}

function doEnter(btn) {
  var j = S.join.p;
  var name = S.join.isNew ? $('#newName').value.trim() : S.join.name;
  var pw = $('#pw').value.trim();
  var err = $('#err');
  if (!name) { err.textContent = S.join.isNew ? '이름을 적어 주세요.' : '이름을 고르세요.'; return; }
  if (!pw) { err.textContent = '비밀번호를 넣으세요.'; $('#pw').focus(); return; }
  err.textContent = '';
  return busy(btn, function () {
    return call('apiEnter', j.id, name, pw, S.join.isNew, S.join.isNew ? $('#newPhone').value.trim() : '').then(function (v) {
      remember(j.id, v.me, pw);
      enterView(v, pw);
    }, function (e) { err.textContent = e.message; });
  });
}

/* ───────── 참가자 화면 ───────── */

function enterView(v, pw) {
  S.view = v; S.pw = pw;
  var mine = v.responses[v.me];
  S.tab = v.project.type === 'select' ? 'sel' : mine && mine.done && !v.project.anon && !v.hidden ? 'result' : 'mine';
  S.nom = null;
  resetDraft();
  setUrl({ p: v.project.id });
  showProject(false);
}

function resetDraft() {
  var v = S.view, mine = v.responses[v.me];
  S.draft = {};
  v.project.questions.forEach(function (q) { S.draft[q.id] = ((mine && mine.answers[q.id]) || []).slice(); });
  S.memo = mine ? mine.memo || '' : '';
}

function dirty() {
  if (!S.view || !S.draft) return false;
  var v = S.view, mine = v.responses[v.me];
  if ((S.memo || '').trim() !== ((mine && mine.memo) || '')) return true;
  return v.project.questions.some(function (q) {
    var a = (S.draft[q.id] || []).slice().sort().join(), b = ((mine && mine.answers[q.id]) || []).slice().sort().join();
    return a !== b;
  });
}

// 선택지마다 고른 사람. useDraft 면 내 것은 아직 저장 안 한 선택으로 센다.
function tally(v, useDraft) {
  var p = v.project, count = {}, done = [];
  if (p.anon) {
    // 무기명: 표 수만 있고 이름은 없다. count[q][o] 는 숫자.
    p.names.slice().sort(byKo).forEach(function (n) { var r = v.responses[n]; if (r && r.done) done.push(n); });
    p.questions.forEach(function (q) { count[q.id] = {}; q.options.forEach(function (o) { count[q.id][o.id] = v.tally ? v.tally.counts[q.id][o.id] || 0 : 0; }); });
    return { count: count, done: done, anon: true, wait: p.names.filter(function (n) { return done.indexOf(n) < 0; }).sort(byKo) };
  }
  p.questions.forEach(function (q) { count[q.id] = {}; q.options.forEach(function (o) { count[q.id][o.id] = []; }); });
  p.names.slice().sort(byKo).forEach(function (n) {
    var r = v.responses[n];
    var ans = useDraft && n === v.me ? S.draft : r && r.answers;
    if (r && r.done) done.push(n);
    if (!ans) return;
    p.questions.forEach(function (q) { (ans[q.id] || []).forEach(function (id) { if (count[q.id][id]) count[q.id][id].push(n); }); });
  });
  return { count: count, done: done, wait: p.names.filter(function (n) { return done.indexOf(n) < 0; }).sort(byKo) };
}

function showProject(keepScroll) {
  if (S.view.project.type === 'select') return showSel(keepScroll);
  S.screen = 'project';
  var v = S.view, p = v.project, t = tally(v, S.tab === 'mine');
  var many = S.init && S.init.projects.length > 1;
  render('<div class="top"><div class="top-l">' + (many ? '<button class="link" data-act="home">‹ 목록</button>' : '') + '</div>' +
    '<div class="top-r"><span class="who">' + esc(v.me) + ' 님</span><button class="link" data-act="logout">다른 이름으로</button></div></div>' +
    '<header class="ph"><h1>' + esc(p.title) + (p.anon ? '<span class="tag">무기명</span>' : '') + '</h1>' + (p.desc ? '<div class="desc">' + nl(p.desc) + '</div>' : '') + '</header>' +
    '<div class="tabs"><button class="' + (S.tab === 'mine' ? 'on' : '') + '" data-act="tab" data-tab="mine">' + (p.anon ? '투표하기' : '내 선택') + '</button>' +
    '<button class="' + (S.tab === 'result' ? 'on' : '') + '" data-act="tab" data-tab="result">결과 보기 <small>' + t.done.length + '/' + p.names.length + '명</small></button></div>' +
    (S.tab === 'mine' ? (p.anon ? anonMineHTML(v, t) : mineHTML(v, t) + saveBarHTML()) : resultHTML(v, t, false)) + FOOT, keepScroll);
}

function mineHTML(v, t) {
  var mine = v.responses[v.me];
  return (mine && mine.done ? '' : '<div class="note">아직 저장한 선택이 없어요. 고른 뒤 아래 [저장하기]를 눌러 주세요.</div>') +
    v.project.questions.map(function (q) {
      var sel = S.draft[q.id] || [];
      return '<section class="card"><div class="qh"><span class="kind">' + KIND[q.kind][0] + ' ' + KIND[q.kind][1] + '</span><span class="rule">' + ruleText(q) + '</span></div>' +
        '<h3>' + esc(q.title) + '</h3><div class="opts">' + q.options.map(function (o) {
          var c = v.hidden ? 0 : t.count[q.id][o.id].length;
          return optBtn(v, q, o, sel, c ? c + '명' : '');
        }).join('') + '</div>' +
        (q.mode === 'upto' || q.mode === 'exact' ? '<p class="hint">' + sel.length + ' / ' + q.n + '개 골랐어요</p>' : '') + '</section>';
    }).join('') +
    '<section class="card"><h3>남길 말 <small>(안 써도 돼요)</small></h3><textarea id="memo" class="inp" maxlength="200" rows="2" placeholder="예) 7시 이후면 다 좋아요">' + esc(S.memo) + '</textarea></section>';
}

function isSelf(v, o) { return v.project.noSelf && o.text === v.me; }
function optBtn(v, q, o, sel, right) {
  var self = isSelf(v, o);
  return '<button class="opt' + (sel.indexOf(o.id) >= 0 ? ' on' : '') + (q.mode === 'one' ? '' : ' multi') + (self ? ' self' : '') + '" data-act="pick" data-q="' + q.id + '" data-o="' + o.id + '">' +
    '<span class="box"></span><span class="ot">' + esc(o.text) + (self ? ' <span class="me-tag">(본인)</span>' : '') + '</span><span class="cnt">' + right + '</span></button>';
}

// 무기명 투표 화면: 한 번 내면 끝. 낸 뒤에는 무엇을 골랐는지도 보여 주지 않는다(서버도 모름).
function anonMineHTML(v, t) {
  var mine = v.responses[v.me];
  if (mine && mine.done) {
    return '<section class="card voted"><div class="big-ic">🗳️</div><h3>투표를 마쳤어요</h3>' +
      '<p>무기명이라 누가 무엇을 골랐는지 아무도(관리자도) 볼 수 없어요.<br>' + (v.hidden ? '결과는 관리자가 발표해요.' : '[결과 보기]에서 지금까지의 표를 볼 수 있어요.') + '</p></section>';
  }
  return '<div class="lock">🔒 <b>무기명 투표</b> · 한 번만 낼 수 있고, 낸 뒤에는 바꿀 수 없어요.' + (v.project.noSelf ? ' 본인은 뽑을 수 없어요.' : '') + '</div>' +
    v.project.questions.map(function (q) {
      var sel = S.draft[q.id] || [];
      return '<section class="card"><div class="qh"><span class="kind">' + KIND[q.kind][0] + ' ' + KIND[q.kind][1] + '</span><span class="rule">' + ruleText(q) + '</span></div>' +
        '<h3>' + esc(q.title) + '</h3><div class="opts">' + q.options.map(function (o) { return optBtn(v, q, o, sel, ''); }).join('') + '</div>' +
        (q.mode === 'upto' || q.mode === 'exact' ? '<p class="hint">' + sel.length + ' / ' + q.n + '개 골랐어요</p>' : '') + '</section>';
    }).join('') +
    '<section class="card"><h3>남길 말 <small>(안 써도 돼요 · 이름 없이 순서를 섞어 보여요)</small></h3><textarea id="memo" class="inp" maxlength="200" rows="2" placeholder="예) 추천 이유">' + esc(S.memo) + '</textarea></section>' +
    '<div class="savebar"><div><span>' + countPicked() + '개 골랐어요</span><button class="btn pri" data-act="vote"' + (countPicked() ? '' : ' disabled') + '>투표하기</button></div></div>';
}
function countPicked() { return Object.keys(S.draft || {}).reduce(function (a, k) { return a + S.draft[k].length; }, 0); }

function saveBarHTML() {
  var d = dirty();
  return '<div class="savebar"><div><span class="' + (d ? 'dirty' : '') + '">' + (d ? '저장 안 한 변경이 있어요' : '저장된 상태예요') + '</span>' +
    '<button class="btn pri" data-act="save"' + (d ? '' : ' disabled') + '>저장하기</button></div></div>';
}
function updateSaveBar() {
  var bar = document.querySelector('.savebar');
  if (bar && !(S.view && S.view.project.anon)) bar.outerHTML = saveBarHTML();
}

function resultHTML(v, t, admin) {
  var p = v.project;
  if (v.hidden) {
    return '<section class="card sum"><div class="big">' + t.done.length + '<small>/ ' + p.names.length + '명 ' + (p.anon ? '투표' : '응답') + '</small></div>' +
      '<p class="wait">' + (t.wait.length ? '아직 안 한 사람: ' + t.wait.map(esc).join(', ') : '모두 마쳤어요 🎉') + '</p>' +
      '<div class="upd">' + esc(shortTime(v.at)) + ' 기준 · <button class="link" data-act="refresh">새로고침</button></div></section>' +
      '<section class="card empty">🔒 결과는 관리자만 볼 수 있어요. 마감 뒤 관리자가 발표해요.</section>';
  }
  if (p.anon) return anonResultHTML(v, t, admin);
  var out = '<section class="card sum"><div class="big">' + t.done.length + '<small>/ ' + p.names.length + '명 응답</small></div>' +
    '<p class="wait">' + (t.wait.length ? '아직 안 한 사람: ' + t.wait.map(esc).join(', ') : '모두 응답했어요 🎉') + '</p>' +
    '<div class="upd">' + esc(shortTime(v.at)) + ' 기준 · <button class="link" data-act="refresh">새로고침</button></div></section>';
  out += p.questions.map(function (q) {
    var c = t.count[q.id];
    var max = Math.max.apply(null, [0].concat(q.options.map(function (o) { return c[o.id].length; })));
    var total = Math.max(1, t.done.length);
    return '<section class="card"><div class="qh"><span class="kind">' + KIND[q.kind][0] + ' ' + KIND[q.kind][1] + '</span><span class="rule">' + ruleText(q) + '</span></div><h3>' + esc(q.title) + '</h3>' +
      q.options.map(function (o) {
        var ns = c[o.id], top = max > 0 && ns.length === max;
        return '<div class="res' + (top ? ' best' : '') + '"><div class="rl"><span class="ot">' + esc(o.text) + '</span>' + (top ? '<span class="badge">가장 많음</span>' : '') +
          '<span class="cnt">' + ns.length + '명</span></div><div class="bar"><i style="width:' + Math.round(ns.length / total * 100) + '%"></i></div>' +
          (ns.length ? '<div class="who">' + ns.map(function (n) { return '<span class="nm' + (n === v.me ? ' me' : '') + '">' + esc(n) + '</span>'; }).join('') + '</div>' : '') + '</div>';
      }).join('') + '</section>';
  }).join('');
  out += '<section class="card"><h3>사람별 선택</h3>' + p.names.slice().sort(byKo).map(function (n) {
    var r = v.responses[n], has = r && r.done;
    return '<div class="person' + (n === v.me ? ' me' : '') + '"><div class="pn"><b>' + esc(n) + '</b>' +
      (has ? '<small>' + esc(shortTime(r.at)) + '</small>' : '<small class="no">아직</small>') +
      (admin && has ? '<button class="link danger" data-act="clearAnswer" data-name="' + esc(n) + '">응답 지우기</button>' : '') + '</div>' +
      (has ? p.questions.map(function (q) {
        var ids = r.answers[q.id] || [];
        return '<div class="pl"><span>' + esc(q.title) + '</span><b>' + (ids.length ? ids.map(function (id) { return esc(optText(q, id)); }).join(', ') : '-') + '</b></div>';
      }).join('') + (r.memo ? '<div class="memo">💬 ' + esc(r.memo) + '</div>' : '') : '') + '</div>';
  }).join('') + '</section>';
  return out;
}

// 무기명 결과: 표 수와 순위만. 이름은 없다. 투표한 사람 목록(참여 여부)만 보여 준다.
function anonResultHTML(v, t, admin) {
  var p = v.project, memos = (v.tally && v.tally.memos) || [];
  var out = '<section class="card sum"><div class="big">' + t.done.length + '<small>/ ' + p.names.length + '명 투표</small></div>' +
    '<p class="wait">' + (t.wait.length ? '아직 안 한 사람: ' + t.wait.map(esc).join(', ') : '모두 투표했어요 🎉') + '</p>' +
    '<div class="upd">' + esc(shortTime(v.at)) + ' 기준 · <button class="link" data-act="refresh">새로고침</button></div></section>';
  out += p.questions.map(function (q) {
    var c = t.count[q.id];
    var opts = q.options.slice().sort(function (a, b) { return c[b.id] - c[a.id]; });
    var max = Math.max.apply(null, [0].concat(q.options.map(function (o) { return c[o.id]; })));
    var total = q.options.reduce(function (a, o) { return a + c[o.id]; }, 0);
    return '<section class="card"><div class="qh"><span class="kind">' + KIND[q.kind][0] + ' ' + KIND[q.kind][1] + '</span><span class="rule">' + ruleText(q) + ' · 모두 ' + total + '표</span></div><h3>' + esc(q.title) + '</h3>' +
      opts.map(function (o) {
        var k = c[o.id], top = max > 0 && k === max;
        return '<div class="res' + (top ? ' best' : '') + '"><div class="rl"><span class="ot">' + esc(o.text) + '</span>' + (top ? '<span class="badge">🏆 1위</span>' : '') +
          '<span class="cnt">' + k + '표</span></div><div class="bar"><i style="width:' + (max ? Math.round(k / max * 100) : 0) + '%"></i></div></div>';
      }).join('') + '</section>';
  }).join('');
  if (memos.length) out += '<section class="card"><h3>남긴 말 <small>' + memos.length + '개 · 이름 없음, 순서 섞임</small></h3><ul class="memos">' +
    memos.map(function (m) { return '<li>💬 ' + esc(m) + '</li>'; }).join('') + '</ul></section>';
  if (admin) out += '<section class="card"><h3>투표 관리</h3><p class="hint" style="margin:0 0 10px">무기명이라 한 사람의 표만 골라 지울 수는 없어요. 시험 삼아 넣은 표가 있으면 모두 지우고 다시 시작하세요.</p>' +
    '<button class="btn sm danger" data-act="resetVotes">투표 초기화 (표·남긴 말 모두 지우기)</button></section>';
  return out;
}

function pick(qid, oid) {
  var q = S.view.project.questions.filter(function (x) { return x.id === qid; })[0];
  var sel = S.draft[qid], i = sel.indexOf(oid);
  var o0 = q.options.filter(function (x) { return x.id === oid; })[0];
  if (i < 0 && o0 && isSelf(S.view, o0)) return toast('본인은 뽑을 수 없어요.');
  var lim = q.mode === 'one' ? 1 : q.mode === 'any' ? Infinity : q.n;
  if (i >= 0) sel.splice(i, 1);
  else if (lim === 1) S.draft[qid] = [oid];
  else if (sel.length >= lim) {
    return toast((q.mode === 'upto' ? q.n + '개까지' : '꼭 ' + q.n + '개만') + ' 고를 수 있어요. 다른 것을 먼저 빼 주세요.');
  } else sel.push(oid);
  // 저장할 때는 선택지 순서대로
  S.draft[qid] = q.options.map(function (o) { return o.id; }).filter(function (id) { return S.draft[qid].indexOf(id) >= 0; });
  showProject(true);
}

function save(btn) {
  var v = S.view;
  var bad = v.project.questions.filter(function (q) { var k = S.draft[q.id].length; return q.mode === 'exact' && k && k !== q.n; })[0];
  if (bad) return toast('"' + bad.title + '"은(는) 꼭 ' + bad.n + '개를 골라 주세요.');
  return busy(btn, function () {
    return call('apiSave', v.project.id, v.me, S.pw, S.draft, S.memo).then(function (nv) {
      S.view = nv; resetDraft(); S.tab = 'result';
      showProject(false);
      toast('저장했습니다 ✓  언제든 다시 바꿀 수 있어요.');
    });
  });
}

function vote(btn) {
  var v = S.view;
  var bad = v.project.questions.filter(function (q) { var k = S.draft[q.id].length; return q.mode === 'exact' && k && k !== q.n; })[0];
  if (bad) return toast('"' + bad.title + '"은(는) 꼭 ' + bad.n + '개를 골라 주세요.');
  var empty = v.project.questions.filter(function (q) { return !S.draft[q.id].length; });
  var lines = v.project.questions.map(function (q) {
    var ids = S.draft[q.id];
    return '· ' + q.title + ': ' + (ids.length ? ids.map(function (id) { return optText(q, id); }).join(', ') : '(고르지 않음)');
  }).join('\n');
  ask('이대로 투표할까요? 낸 뒤에는 바꿀 수 없어요.\n\n' + lines + (empty.length ? '\n\n고르지 않은 질문은 기권으로 처리돼요.' : ''), '투표하기').then(function (ok) {
    if (!ok) return;
    busy(btn, function () {
      return call('apiSave', v.project.id, v.me, S.pw, S.draft, S.memo).then(function (nv) {
        S.view = nv; resetDraft(); S.tab = nv.project.type === 'select' ? 'sel' : nv.hidden ? 'mine' : 'result';

        toast('투표했습니다 ✓');

var IS_PHONE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
var IS_IOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
function fmtPhone(d) { return String(d).replace(/^(\d{3})(\d{3,4})(\d{4})$/, '$1-$2-$3'); }
// 폰의 문자 앱을 받는 사람·내용이 채워진 채로 연다 (아이폰은 &body=, 안드로이드는 ?body=)
function smsHref(phone, body) { return 'sms:' + phone + (IS_IOS ? '&' : '?') + 'body=' + encodeURIComponent(body); }

function sendHTML(v, t) {

  var withPhone = names.filter(function (n) { return ph[n]; }).length;

}

function newQuestion(kind) {
  var d = Q_DEFAULT[kind];
  return { id: rid('q'), title: d[0], kind: kind, mode: d[1], n: 2, options: [] };
}

function startEdit(src, asCopy) {
  if (src && src.project.type === 'select') return startSelEdit(src, asCopy);
  if (!src) {
    S.edit = { id: '', title: '', desc: '', pw: S.admin.defaultPw || '1234', names: '', allowJoin: false, questions: [newQuestion('date')], votes: {}, anon: false, noSelf: false, reveal: 'live', fresh: true };
  } else {
    var p = src.project;
    var votes = {};
    if (!asCopy && src.tally) Object.keys(src.tally.counts).forEach(function (qid) {
      var c = src.tally.counts[qid]; Object.keys(c).forEach(function (id) { if (c[id]) votes[qid + '/' + id] = c[id]; });
    });
    if (!asCopy && !p.anon) Object.keys(src.responses).forEach(function (n) {
      var a = src.responses[n].answers;
      Object.keys(a).forEach(function (qid) { a[qid].forEach(function (id) { votes[qid + '/' + id] = (votes[qid + '/' + id] || 0) + 1; }); });
    });
    S.edit = {
      id: asCopy ? '' : p.id, title: asCopy ? p.title + ' (복사)' : p.title, desc: p.desc, pw: p.pw,
      names: rosterText(p), allowJoin: p.allowJoin, questions: clone(p.questions), votes: votes,
      anon: !!p.anon, noSelf: !!p.noSelf, reveal: p.reveal || (p.anon ? 'admin' : 'live')
    };
  }
  S.editStart = JSON.stringify(S.edit);
  showEditor(false);
}

// 명단 글: 한 줄에 "홍길동" 또는 "홍길동 010-1234-5678"
function rosterText(p) {
  var ph = p.phones || {};
  return p.names.map(function (n) { return ph[n] ? n + ' ' + fmtPhone(ph[n]) : n; }).join('\n');
}
var PHONE_RE = /(01[016789])[-.\s]?(\d{3,4})[-.\s]?(\d{4})/;
function countNames(text) {
  var seen = {}, n = 0, tel = 0;
  String(text || '').split(/[\n,]+/).forEach(function (s) {
    var m = s.match(PHONE_RE);
    if (m) tel++;
    s = (m ? s.replace(m[0], '') : s).replace(/\s+/g, ' ').trim();
    if (s && !seen[s]) { seen[s] = 1; n++; }
  });
  return n + '명' + (tel ? ' · 번호 ' + tel + '개' : '');
}

// 새 프로젝트 빠른 시작
var TEMPLATES = {
  meet: { title: '모임 날짜 정하기', desc: '되는 날을 모두 골라 주세요!', anon: false, noSelf: false, reveal: 'live', qs: [['date', '언제 만날까요?', 'any'], ['place', '어디서 만날까요?', 'one']] },
  menu: { title: '점심 메뉴 고르기', desc: '먹고 싶은 메뉴를 골라 주세요.', anon: false, noSelf: false, reveal: 'live', qs: [['menu', '무엇을 먹을까요?', 'one']] },
  award: { title: '무기명 투표', desc: '무기명이라 누가 무엇을 골랐는지 아무도 알 수 없어요.', anon: true, noSelf: false, reveal: 'admin', qs: [['etc', '어느 쪽이 좋을까요?', 'one']] }
};
function rosterNames(text) {
  var seen = {}, out = [];
  String(text || '').split(/[\n,]+/).forEach(function (s) {
    var m = s.match(PHONE_RE);
    s = (m ? s.replace(m[0], '') : s).replace(/\s+/g, ' ').trim();
    if (s && !seen[s]) { seen[s] = 1; out.push(s); }
  });
  return out;
}
function applyTemplate(key) {
  var t = TEMPLATES[key], e = S.edit;

  e.questions.forEach(function (q) { if (q.kind === 'person') q.options = rosterNames(e.names).map(function (n) { return { id: rid('o'), text: n }; }); });
  e.fresh = false;
  showEditor(false);
  toast(t.anon ? '무기명 투표로 채웠어요. 참가자 명단을 넣으면 후보도 자동으로 채워져요.' : '채웠어요. 고칠 곳만 고치세요.');
}

function addOptions(i, texts) {
  var q = S.edit.questions[i];
  var have = q.options.map(function (o) { return o.text; });
  var added = 0;
  texts.forEach(function (t) {
    t = String(t).trim();
    if (!t || have.indexOf(t) >= 0) return;
    q.options.push({ id: rid('o'), text: t }); have.push(t); added++;
  });
  if (!added) return toast(texts.length ? '이미 있는 선택지예요.' : '내용을 넣어 주세요.');
  showEditor(true);
}

function editData() {
  var e = S.edit;
  return { id: e.id, title: e.title, desc: e.desc, pw: e.pw, names: e.names, allowJoin: e.allowJoin, questions: e.questions, anon: !!e.anon, noSelf: !!e.noSelf, reveal: e.reveal };
}

function editSave(btn) {
  var e = S.edit;
  if (e.type === 'select') return selEditSave(btn);
  if (!String(e.title).trim()) return toast('제목을 넣어 주세요.');
  if (!/^\d{4,8}$/.test(String(e.pw).trim())) return toast('참가자 비밀번호는 숫자 4~8자리예요.');
  var empty = e.questions.filter(function (q) { return !q.options.length; })[0];
  if (empty) return toast('"' + (empty.title || '제목 없는 질문') + '"에 선택지를 넣어 주세요.');
  var start = JSON.parse(S.editStart), lost = 0;
  start.questions.forEach(function (q0) {
    var q1 = e.questions.filter(function (x) { return x.id === q0.id; })[0];
    q0.options.forEach(function (o) {
      var still = q1 && q1.options.some(function (x) { return x.id === o.id; });
      if (!still) lost += e.votes[q0.id + '/' + o.id] || 0;
    });
  });
  var go = lost ? ask('이미 고른 사람이 있는 선택지를 지웠어요. 그 선택 ' + lost + '건이 사라집니다. 저장할까요?', '저장', true) : Promise.resolve(true);
  return go.then(function (ok) {
    if (!ok) return;
    return busy(btn, function () {
      return call('apiSaveProject', S.adminPw, editData()).then(function (r) {
        toast(e.id ? '저장했습니다.' : '만들었습니다. 초대 문구를 복사해 보내세요.');
        S.atab = 'open';
        return reloadAdmin().then(function () { return adminView(r.id); });
      });
    });
  });
}

/* ───────── 선정하기 ───────── */
// 흐름: 후보 등록(멤버가 후보·추천 이유를 올림) → 투표(무기명, 한 번) → 마감 → 관리자가 결과 공개.
// 같은 이름(시리즈)으로 만들면 1회·2회…로 이어지고, 멤버는 공개된 지난 회차 결과를 볼 수 있다.

var PHASE = { nominate: ['📝', '후보 등록 중'], vote: ['🗳️', '투표 중'], closed: ['⏳', '투표 마감'], published: ['🏆', '결과 공개'] };
function selPhase(p) { return p.published ? 'published' : p.phase; }
function parseT(t) { var m = String(t || '').match(/^(\d{4})-(\d\d)-(\d\d)[ T](\d\d):(\d\d)/); return m ? new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]) : null; }
function fmtT(t) {
  var d = parseT(t); if (!d) return '';
  return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + WD[d.getDay()] + ') ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function leftT(t) {
  var d = parseT(t); if (!d) return '';
  var ms = d - new Date(); if (ms <= 0) return '';
  var m = Math.floor(ms / 60000), dd = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60), mi = m % 60;
  return dd ? dd + '일 ' + h + '시간' : h ? h + '시간 ' + mi + '분' : Math.max(1, mi) + '분';
}
function toLocalInput(t) { var m = String(t || '').match(/^(\d{4}-\d\d-\d\d) (\d\d:\d\d)/); return m ? m[1] + 'T' + m[2] : ''; }
function ruleSel(p) { return '1인 ' + (p.votes || 1) + '표' + (p.noSelf ? ' · 본인 제외' : ''); }
function selTag(p) { return '<span class="tag sel">' + (p.round ? p.round + '회 · ' : '') + '선정하기</span>'; }

function phaseBanner(p, admin) {
  var ph = selPhase(p), ic = PHASE[ph];
  var line = '';
  if (ph === 'nominate') line = p.voteStart ? '투표 시작: ' + fmtT(p.voteStart) + (leftT(p.voteStart) ? ' · ' + leftT(p.voteStart) + ' 남음' : '') : '투표 시작은 관리자가 알려 드려요.';
  if (ph === 'vote') line = (p.voteEnd ? '마감: ' + fmtT(p.voteEnd) + (leftT(p.voteEnd) ? ' · ' + leftT(p.voteEnd) + ' 남음' : '') : '관리자가 마감할 때까지') + ' · ' + ruleSel(p);
  if (ph === 'closed') line = admin ? '결과를 확인하고 [결과 공개]를 누르면 멤버에게 보여요.' : '관리자가 결과를 발표하면 여기서 볼 수 있어요.';
  if (ph === 'published') line = '누가 누구를 뽑았는지는 공개되지 않아요.';
  var steps = ['nominate', 'vote', 'closed', 'published'].map(function (k, i) {
    var cur = ['nominate', 'vote', 'closed', 'published'].indexOf(ph);
    return '<span class="step' + (i < cur ? ' done' : i === cur ? ' on' : '') + '">' + ['후보 등록', '투표', '마감', '결과 공개'][i] + '</span>';
  }).join('<i>›</i>');
  return '<section class="card phase ' + ph + '"><div class="steps">' + steps + '</div><div class="ph-now">' + ic[0] + ' <b>' + ic[1] + '</b></div><div class="ph-line">' + esc(line) + '</div></section>';
}

function reasonsHTML(c, admin) {
  if (!c.reasons.length) return '';
  return '<ul class="reasons">' + c.reasons.map(function (r) {
    return '<li>' + (admin ? esc(r.text) + ' <small class="by">— ' + esc(r.by) + '</small>' : esc(r)) + '</li>';
  }).join('') + '</ul>';
}

function rankHTML(res, admin) {
  var max = Math.max.apply(null, [0].concat(res.results.map(function (x) { return x.votes; })));
  var total = res.results.reduce(function (a, x) { return a + x.votes; }, 0);
  var rank = 0, prev = -1;
  return '<div class="rank-meta">' + res.voters + ' / ' + res.members + '명 투표 · 모두 ' + total + '표</div>' +
    (res.results.length ? res.results.map(function (x, i) {
      if (x.votes !== prev) { rank = i + 1; prev = x.votes; }
      var top = max > 0 && x.votes === max;
      return '<div class="res' + (top ? ' best' : '') + '"><div class="rl"><span class="rk">' + rank + '</span><span class="ot">' + esc(x.name) + '</span>' + (top ? '<span class="badge">' + (res.published ? '🏆 선정' : '1위') + '</span>' : '') +
        '<span class="cnt">' + x.votes + '표</span></div><div class="bar"><i style="width:' + (max ? Math.round(x.votes / max * 100) : 0) + '%"></i></div>' +
        (x.reasons.length ? '<details><summary>추천 이유 ' + x.reasons.length + '개</summary>' + reasonsHTML({ reasons: x.reasons }, admin && typeof x.reasons[0] === 'object') + '</details>' : '') + '</div>';
    }).join('') : '<p class="hint">후보가 없었어요.</p>');
}

function historyHTML(v) {
  var h = v.history || [];
  if (!h.length) return '<div class="card empty">지난 회차가 아직 없어요.</div>';
  return h.map(function (r, i) {
    var top = r.results.filter(function (x) { return x.votes && x.votes === r.results[0].votes; }).map(function (x) { return x.name; });
    return '<section class="card"><details' + (i === 0 ? ' open' : '') + '><summary class="hsum"><b>' + esc(r.title) + '</b>' +
      (r.published ? '<span class="st open">공개</span>' : '<span class="st closed">비공개</span>') +
      '<span class="hwin">' + (top.length ? '🏆 ' + top.map(esc).join(', ') : '-') + '</span></summary>' +
      '<div class="meta">' + (r.voteEnd ? shortDate(r.voteEnd) + ' 마감' : '') + '</div>' + rankHTML(r, false) + '</details></section>';
  }).join('');
}

function showSel(keepScroll) {
  S.screen = 'project';
  var v = S.view, p = v.project, ph = selPhase(p), mine = v.responses[v.me];
  var many = S.init && S.init.projects.length > 1;
  var hist = (v.history || []).length;
  if (S.tab !== 'hist') S.tab = 'sel';
  var body = '';
  if (S.tab === 'hist') body = historyHTML(v);
  else if (ph === 'nominate') body = nominateHTML(v);
  else if (ph === 'vote') body = mine && mine.done ? votedHTML(v) : selVoteHTML(v);
  else if (ph === 'closed') body = '<section class="card sum"><div class="big">' + tally(v, false).done.length + '<small>/ ' + p.names.length + '명 투표</small></div>' +
    '<p class="wait">' + (mine && mine.done ? '✅ 나도 투표했어요.' : '투표하지 않았어요.') + ' 결과 발표를 기다려 주세요.</p></section>' + candListHTML(v, false);

/* 관리자: 선정하기 만들기·고치기 */
function seriesList() {
  var seen = {}, out = [];
  (S.admin.projects || []).forEach(function (p) { if (p.type === 'select' && p.series && !seen[p.series]) { seen[p.series] = 1; out.push(p.series); } });
  return out;
}
function nextRound(series) {
  var m = 0;
  (S.admin.projects || []).forEach(function (p) { if (p.type === 'select' && p.series === series && p.id !== S.edit.id && p.round > m) m = p.round; });
  return m + 1;
}

      nominate: true, noSelf: true, votes: 1, voteStart: '', voteEnd: '', cands: '' };

    S.edit = { type: 'select', id: asCopy ? '' : p.id, series: p.series, desc: p.desc, pw: p.pw, names: rosterText(p), allowJoin: p.allowJoin,
      nominate: p.nominate !== false, noSelf: !!p.noSelf, votes: p.votes || 1, voteStart: asCopy ? '' : toLocalInput(p.voteStart), voteEnd: asCopy ? '' : toLocalInput(p.voteEnd), cands: '' };

      publish: '결과를 멤버에게 공개할까요?\n표 수와 순위가 보이고, 누가 누구를 뽑았는지는 보이지 않아요.',
      reopen: '마감을 취소하고 투표를 계속 받을까요?',
      unpublish: '결과 공개를 취소할까요? 멤버에게 다시 안 보입니다.'
    }[op];
    ask(msg, el.textContent).then(function (ok) {
      if (!ok) return;
      busy(el, function () { return call('apiSetPhase', S.adminPw, p.id, op).then(function () { toast('바꿨습니다.'); return adminView(p.id, true); }); });
    });
  },
  candAdd: function (el) {
    var p = S.aview.project, name = $('#acName').value.trim(), reason = $('#acReason').value.trim();
    if (!name) return toast('후보 이름을 넣어 주세요.');
    busy(el, function () { return call('apiAdminCands', S.adminPw, p.id, 'add', { name: name, reason: reason }).then(function () { toast('넣었습니다.'); return adminView(p.id, true); }); });
  },
  candDel: function (el) {
    var p = S.aview.project;
    ask(el.dataset.name + ' 님을 후보에서 뺄까요? 추천 이유도 함께 지워집니다.', '빼기', true).then(function (ok) {
      if (!ok) return;
      busy(el, function () { return call('apiAdminCands', S.adminPw, p.id, 'remove', { cid: el.dataset.id }).then(function () { toast('뺐습니다.'); return adminView(p.id, true); }); });
    });
  },
  pickContacts: function () {
    navigator.contacts.select(['name', 'tel'], { multiple: true }).then(function (list) {
      var lines = (list || []).map(function (c) {
        var n = (c.name && c.name[0]) || '', t = (c.tel && c.tel[0]) || '';
        t = String(t).replace(/^\+82\s?/, '0').replace(/[^\d]/g, '');
        return (n + ' ' + t).trim();
      }).filter(String);
      if (!lines.length) return;
      S.edit.names = (String(S.edit.names || '').trim() ? String(S.edit.names).trim() + '\n' : '') + lines.join('\n');
      showSelEditor(true);
      toast(lines.length + '명을 추가했어요.');
    }, function () { });
  }
};

/* ───────── 누르기 ───────── */

var ACT = {
  retry: function () { var f = S.retry || boot; f(); },
  home: function () { if (S.init) showHome(); else { setUrl({}); boot(); } },
  goAdmin: function () { startAdmin(); },
  openProject: function (el) { openProject(el.dataset.id); },
  pickName: function (el) {
    S.join.name = el.dataset.name; S.join.isNew = false;
    document.querySelectorAll('.names .chip').forEach(function (c) { c.classList.toggle('on', c === el); });
    $('#newBox').style.display = 'none';
    $('#pw').focus();
  },
  newName: function (el) {
    S.join.isNew = true; S.join.name = '';
    document.querySelectorAll('.names .chip').forEach(function (c) { c.classList.toggle('on', c === el); });
    $('#newBox').style.display = ''; $('#newName').focus();
  },
  enter: function (el) { doEnter(el); },
  logout: function () {
    var go = dirty() ? ask('저장하지 않은 선택이 있어요. 그래도 나갈까요?', '나가기') : Promise.resolve(true);
    go.then(function (ok) { if (!ok) return; var pid = S.view.project.id; forget(pid); S.view = null; showJoin(pid); });
  },
  tab: function (el) { S.tab = el.dataset.tab; showProject(false); },
  pick: function (el) { pick(el.dataset.q, el.dataset.o); },
  save: function (el) { save(el); },
  vote: function (el) { vote(el); },
  tpl: function (el) { applyTemplate(el.dataset.k); },
  addRoster: function (el) {
    var names = rosterNames(S.edit.names);
    if (!names.length) return toast('먼저 위 [참가자 명단]에 이름을 넣어 주세요.');
    addOptions(+el.dataset.qi, names);
  },
  resetVotes: function (el) {
    var p = S.aview.project;
    ask('"' + p.title + '"의 표와 남긴 말, 투표 여부를 모두 지울까요?\n모두 다시 투표할 수 있게 됩니다. 되돌릴 수 없어요.', '모두 지우기', true).then(function (ok) {
      if (!ok) return;
      busy(el, function () { return call('apiResetVotes', S.adminPw, p.id).then(function () { toast('투표를 초기화했습니다.'); return adminView(p.id, true); }); });
    });
  },
  refresh: function (el) {
    if (S.screen === 'aview') return busy(el, function () { return adminView(S.aview.project.id, true).then(function () { toast('새로 불러왔습니다.'); }); });
    busy(el, function () { return refresh(false); });
  },

  adminLogin: function (el) {
    var pw = $('#apw').value.trim();
    if (!pw) return;
    busy(el, function () {
      return call('apiAdmin', pw).then(function (a) { adminIn(a, pw); }, function (e) { $('#err').textContent = e.message; });
    });
  },
  adminOut: function () { sess.set('yaksok.admin', ''); S.admin = null; S.adminPw = ''; setUrl({}); boot(); },
  adminHome: function () { loading(); reloadAdmin().then(showAdminHome, function (e) { fatal(e, function () { ACT.adminHome(); }); }); },
  atab: function (el) { S.atab = el.dataset.tab; showAdminHome(); },
  adminView: function (el) { adminView(el.dataset.id); },
  newProject: function () { startEdit(null); },
  editProject: function (el) {
    loading();
    call('apiAdminView', S.adminPw, el.dataset.id).then(function (v) { startEdit(v, false); }, function (e) { toast(e.message); showAdminHome(); });
  },
  copyProject: function (el) {
    loading();
    call('apiAdminView', S.adminPw, el.dataset.id).then(function (v) { startEdit(v, true); toast('복사했어요. 제목·명단·질문을 고친 뒤 [만들기]를 누르세요.'); }, function (e) { toast(e.message); showAdminHome(); });
  },
  toggleStatus: function (el) {
    var p = S.admin.projects.filter(function (x) { return x.id === el.dataset.id; })[0] || (S.aview && S.aview.project);
    var open = p.status !== 'open';
    var selP = p.type === 'select';
    ask(open ? '"' + p.title + '"을(를) 다시 열까요? 참가자가 다시 들어와 고를 수 있어요.' : selP ? '"' + p.title + '"을(를) 보관할까요?\n목록에서 [지난 프로젝트]로 옮겨집니다. 결과를 공개했다면 멤버는 계속 결과를 볼 수 있어요.' : '"' + p.title + '"을(를) 마감할까요?\n참가자는 더 이상 들어오거나 바꿀 수 없고, [지난 프로젝트]로 옮겨집니다. 나중에 다시 열 수 있어요.', open ? '다시 열기' : '마감하기')
      .then(function (ok) {
        if (!ok) return;
        busy(el, function () {
          return call('apiSetStatus', S.adminPw, p.id, open).then(function () {
            toast(open ? '다시 열었습니다.' : '마감했습니다.');
            return reloadAdmin().then(function () { if (S.screen === 'aview') return adminView(p.id); showAdminHome(); });
          });
        });
      });
  },
  deleteProject: function (el) {
    var p = S.admin.projects.filter(function (x) { return x.id === el.dataset.id; })[0];
    ask('"' + p.title + '"과(와) 응답 ' + p.done + '명분을 모두 지웁니다.\n되돌릴 수 없어요. 기록을 남기려면 [마감하기]를 쓰세요.', '지우기', true).then(function (ok) {
      if (!ok) return;
      busy(el, function () { return call('apiDeleteProject', S.adminPw, p.id).then(function () { toast('지웠습니다.'); return reloadAdmin().then(showAdminHome); }); });
    });
  },
  copyInvite: function () { copyText(inviteText(S.aview.project)); },
  // 폰의 공유 창(카톡·문자 등). 공유 창이 없는 브라우저는 복사로
  shareInvite: function () {
    var p = S.aview.project, text = inviteText(p);
    if (!navigator.share) return copyText(text);
    navigator.share({ title: p.title, text: text }).catch(function (e) { if (e && e.name !== 'AbortError') copyText(text); });
  },
  clearAnswer: function (el) {
    var name = el.dataset.name, p = S.aview.project;
    ask(name + ' 님의 응답을 지울까요?\n(본인이 다시 들어와 고를 수 있어요)', '지우기', true).then(function (ok) {
      if (!ok) return;
      busy(el, function () { return call('apiClearAnswer', S.adminPw, p.id, name).then(function () { toast('지웠습니다.'); return adminView(p.id, true); }); });
    });
  },
  settings: function () { showSettings(); },
  saveAdminPw: function (el) {
    var a = $('#na1').value.trim(), b = $('#na2').value.trim();
    if (!/^\d{4,8}$/.test(a)) return toast('숫자 4~8자리로 넣어 주세요.');
    if (a !== b) return toast('두 번 넣은 비밀번호가 달라요.');
    busy(el, function () {
      return call('apiSettings', S.adminPw, { adminPw: a }).then(function () {
        S.adminPw = a; sess.set('yaksok.admin', a);
        $('#na1').value = ''; $('#na2').value = '';
        toast('관리자 비밀번호를 바꿨습니다. 다음부터 새 비밀번호로 들어오세요.');
      });
    });
  },
  saveDefaultPw: function (el) {
    var d = $('#ndp').value.trim();
    if (!/^\d{4,8}$/.test(d)) return toast('숫자 4~8자리로 넣어 주세요.');
    busy(el, function () { return call('apiSettings', S.adminPw, { defaultPw: d }).then(function (r) { S.admin.defaultPw = r.defaultPw; toast('저장했습니다.'); }); });
  },

  editCancel: function () {
    var changed = JSON.stringify(S.edit) !== S.editStart;
    (changed ? ask('저장하지 않고 나갈까요?', '나가기') : Promise.resolve(true)).then(function (ok) {
      if (!ok) return;
      if (S.edit.id) adminView(S.edit.id); else showAdminHome();
    });
  },
  editSave: function (el) { editSave(el); },
  addQ: function (el) { S.edit.questions.push(newQuestion(el.dataset.kind)); showEditor(true); setTimeout(function () { window.scrollTo(0, document.body.scrollHeight); }, 0); },
  qMove: function (el) {
    var qs = S.edit.questions, i = +el.dataset.qi, j = i + +el.dataset.d;
    qs.splice(j, 0, qs.splice(i, 1)[0]); showEditor(true);
  },
  qDel: function (el) {
    var i = +el.dataset.qi, q = S.edit.questions[i];
    if (S.edit.questions.length === 1) return toast('질문은 1개 이상 있어야 해요.');
    ask('"' + (q.title || (i + 1) + '번 질문') + '"을(를) 지울까요?', '지우기', true).then(function (ok) { if (ok) { S.edit.questions.splice(i, 1); showEditor(true); } });
  },
  oMove: function (el) {
    var os = S.edit.questions[+el.dataset.qi].options, i = +el.dataset.oi, j = i + +el.dataset.d;
    os.splice(j, 0, os.splice(i, 1)[0]); showEditor(true);
  },
  oDel: function (el) { S.edit.questions[+el.dataset.qi].options.splice(+el.dataset.oi, 1); showEditor(true); },
  addDate: function (el) {
    var i = +el.dataset.qi, d = $('#ad' + i).value, t = $('#at' + i).value;
    if (!d) return toast('날짜를 고르세요.');
    addOptions(i, [fmtDate(d, t)]);
  },
  addRange: function (el) {
    var i = +el.dataset.qi, a = $('#rf' + i).value, b = $('#rt' + i).value, noWeekend = $('#rw' + i).checked;
    if (!a || !b) return toast('시작 날짜와 끝 날짜를 고르세요.');
    var d = new Date(a + 'T00:00:00'), end = new Date(b + 'T00:00:00'), out = [];
    if (end < d) return toast('끝 날짜가 시작보다 앞이에요.');
    while (d <= end && out.length < 50) {
      if (!(noWeekend && (d.getDay() === 0 || d.getDay() === 6))) {
        out.push(fmtDate(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0')));
      }
      d.setDate(d.getDate() + 1);
    }
    addOptions(i, out);
  },
  addTime: function (el) {
    var i = +el.dataset.qi, t = $('#at' + i).value;
    if (!t) return toast('시간을 고르세요.');
    addOptions(i, [t]);
  },
  addText: function (el) {
    var i = +el.dataset.qi;
    addOptions(i, $('#ax' + i).value.split(','));
    var box = $('#ax' + i); if (box) box.focus();
  }
};

Object.keys(SEL_ACT).forEach(function (k) { ACT[k] = SEL_ACT[k]; });

document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  var f = ACT[el.dataset.act];
  if (f) { ev.preventDefault(); f(el, ev); }
});

document.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Enter' || ev.isComposing || ev.target.tagName === 'TEXTAREA') return;
  var t = ev.target;
  if (t.dataset.enter) { ev.preventDefault(); ACT[t.dataset.enter](t); return; }
  var main = { join: '[data-act="enter"]', alogin: '[data-act="adminLogin"]' }[S.screen];
  if (main && t.tagName === 'INPUT') { ev.preventDefault(); var b = $(main); if (b) b.click(); }
});

// 글자를 칠 때는 화면을 다시 그리지 않고 값만 기억한다
document.addEventListener('input', function (ev) {
  var t = ev.target;
  if (t.id === 'memo') { S.memo = t.value; updateSaveBar(); return; }
  if (t.id === 'nomName' || t.id === 'nomReason') { S.nom = S.nom || { name: '', reason: '' }; S.nom[t.id === 'nomName' ? 'name' : 'reason'] = t.value; return; }
  if (S.screen !== 'editor' || t.tagName === 'SELECT' || t.type === 'checkbox') return;
  if (t.dataset.bind) {
    S.edit[t.dataset.bind] = t.value;
    if (t.dataset.bind === 'names') $('#nameCount').textContent = countNames(t.value);
  } else if (t.dataset.o !== undefined) S.edit.questions[+t.dataset.q].options[+t.dataset.o].text = t.value;
  else if (t.dataset.f === 'title') S.edit.questions[+t.dataset.q].title = t.value;
  else if (t.dataset.f === 'n') S.edit.questions[+t.dataset.q].n = Math.max(1, parseInt(t.value, 10) || 1);
});
document.addEventListener('change', function (ev) {
  var t = ev.target;
  if (S.screen !== 'editor') return;
  if (t.id === 'loadNames' && t.value) {
    var p = S.admin.projects.filter(function (x) { return x.id === t.value; })[0];
    S.edit.names = rosterText(p);
    toast(p.names.length + '명을 불러왔어요. 빼거나 더할 수 있어요.');
    return showEditor(true);
  }
  if (t.dataset.bind === 'allowJoin') S.edit.allowJoin = t.checked;
  if (t.dataset.bind === 'noSelf') S.edit.noSelf = t.checked;
  if (t.dataset.bind === 'nominate') S.edit.nominate = t.checked;
  if (t.dataset.bind === 'votes') S.edit.votes = +t.value;
  if (t.dataset.bind === 'series' && S.edit.type === 'select') return showSelEditor(true);
  if (t.dataset.bind === 'reveal') S.edit.reveal = t.value;
  if (t.dataset.bind === 'anon') {
    S.edit.anon = t.checked;
    if (t.checked) { S.edit.reveal = 'admin'; toast('무기명으로 바꿨어요. 결과는 관리자만 보게 해 뒀어요(바꿀 수 있어요).'); }
    return showEditor(true);
  }
  if (t.dataset.f === 'kind' || t.dataset.f === 'mode') {
    var q = S.edit.questions[+t.dataset.q];
    q[t.dataset.f] = t.value;
    if (t.dataset.f === 'mode' && (q.mode === 'upto' || q.mode === 'exact') && q.n < 2) q.n = 2;
    showEditor(true);
  }
});

boot();
</script>
</body>
</html>
